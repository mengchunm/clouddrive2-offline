<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>动态叠加方块图标 v19 · 45度对称优化</title>
<style>
  :root {
    --canvas: 120px;
    --scale: 1;
    --duration: 4.6s;
    --frame: 3px;

    --blue-light: #50d8f3;
    --blue-mid: #2eabe3;
    --blue-dark: #1777c6;

    --icon-bg:
      radial-gradient(circle at 18% 82%, rgba(255,255,255,.18), transparent 36%),
      linear-gradient(45deg, var(--blue-light) 0%, var(--blue-mid) 56%, var(--blue-dark) 100%);
  }

  @property --x {
    syntax: "<length>";
    inherits: true;
    initial-value: 0px;
  }

  @property --y {
    syntax: "<length>";
    inherits: true;
    initial-value: 0px;
  }

  @property --s {
    syntax: "<length>";
    inherits: true;
    initial-value: 40px;
  }

  * { box-sizing: border-box; }

  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background: #f3f6fa;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .demo {
    display: grid;
    justify-items: center;
    gap: 18px;
  }

  .icon-slot {
    width: calc(var(--canvas) * var(--scale));
    height: calc(var(--canvas) * var(--scale));
  }

  .switch-icon {
    position: relative;
    width: var(--canvas);
    height: var(--canvas);
    overflow: hidden;
    isolation: isolate;
    border-radius: 50%;
    transform: scale(var(--scale));
    transform-origin: left top;
    background-image: var(--icon-bg);
    background-size: var(--canvas) var(--canvas), var(--canvas) var(--canvas);
    background-position: 0 0, 0 0;
    background-repeat: no-repeat;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.24),
      0 8px 20px rgba(23,120,199,.24);
  }

  .card {
    position: absolute;
    inset: 0;
    pointer-events: none;
    animation-duration: var(--duration);
    animation-iteration-count: infinite;
    animation-timing-function: cubic-bezier(.45,.05,.55,.95), step-end;
  }

  .card::before,
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
  }

  /* 渐变固定在圆形画布坐标中，只改变可见窗口，不再移动或重采样。 */
  .card::before {
    background-image: var(--icon-bg);
    background-size: var(--canvas) var(--canvas), var(--canvas) var(--canvas);
    background-position: 0 0, 0 0;
    background-repeat: no-repeat;
    clip-path: inset(
      var(--y)
      calc(var(--canvas) - var(--x) - var(--s))
      calc(var(--canvas) - var(--y) - var(--s))
      var(--x)
    );
  }

  .card::after {
    background: #fff;
    clip-path: inset(
      calc(var(--y) + var(--frame))
      calc(var(--canvas) - var(--x) - var(--s) + var(--frame))
      calc(var(--canvas) - var(--y) - var(--s) + var(--frame))
      calc(var(--x) + var(--frame))
    );
  }

  .card-a {
    --x: 28px;
    --y: 53px;
    --s: 40px;
    z-index: 2;
    animation-name: card-a-geometry, card-a-layer;
  }

  .card-b {
    --x: 47px;
    --y: 27px;
    --s: 47px;
    z-index: 1;
    animation-name: card-b-geometry, card-b-layer;
  }

  /*
    对称优化：所有关键构图的方块中心都落在 x + y = 121px 的 45° 对角轴附近，
    避免停顿画面看起来偏向一侧。

    每个完整循环只停顿一次，并保持正确运动方向：
    0%→12%   左下方块 A 在上层，1/4 覆盖右上方块并停顿
    12%→37%  A 从左下向右上移动、放大；B 向左下移动、缩小
    37%       两块完全分开后切换层级
    37%→62%  B 从左下向右上移动（中途不停顿）
    62%       两块完全分开后再次切换层级
    62%→100% A 从左下向右上移动到下一次停顿构图

    100% 与下一轮 0% 是同一画面，所以循环连接不会倒退或跳变。
  */
  @keyframes card-a-geometry {
    0%, 12%, 100% { --x: 28px; --y: 53px; --s: 40px; }
    37%           { --x: 55px; --y: 16px; --s: 50px; }
    62%           { --x: 18px; --y: 67px; --s: 36px; }
  }

  @keyframes card-b-geometry {
    0%, 12%, 100% { --x: 47px; --y: 27px; --s: 47px; }
    37%           { --x: 18px; --y: 67px; --s: 36px; }
    62%           { --x: 55px; --y: 16px; --s: 50px; }
  }

  /* 层级是离散状态，step-end 可避免 z-index 在两帧之间插值。 */
  @keyframes card-a-layer {
    0%   { z-index: 2; }
    37%  { z-index: 1; }
    62%  { z-index: 2; }
    100% { z-index: 2; }
  }

  @keyframes card-b-layer {
    0%   { z-index: 1; }
    37%  { z-index: 2; }
    62%  { z-index: 1; }
    100% { z-index: 1; }
  }

  .caption {
    color: #536173;
    font-size: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }
</style>
</head>
<body>
  <div class="demo">
    <div class="icon-slot">
      <div class="switch-icon" role="img" aria-label="两个无圆角白色正方形循环交换位置和上下层级">
        <span class="card card-a"></span>
        <span class="card card-b"></span>
      </div>
    </div>
    <div class="caption">纯 CSS · 45° 对称轨迹 · 左下方块覆盖时单次停顿</div>
  </div>
</body>
</html>
