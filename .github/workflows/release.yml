name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.6.42)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
          
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run checks
        run: pnpm run ci && pnpm run typecheck && pnpm run test

      - name: Validate release metadata
        run: pnpm run validate:release -- "${{ env.RELEASE_TAG }}"

      - name: Build
        run: pnpm run build

      - name: Package browser extension
        run: cd packages/extension/build && zip -r ../clouddrive2-browser-extension.zip .

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: |
            packages/offline/dist/clouddrive2-offline.user.js
            packages/artplayer/dist/clouddrive2-artplayer.user.js
            packages/extension/clouddrive2-browser-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
