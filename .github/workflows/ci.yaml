name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install FFmpeg test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formatter and linter
        run: pnpm run ci

      - name: Run TypeScript checks
        run: pnpm run typecheck

      - name: Run regression tests
        run: pnpm run test

      - name: Build
        run: pnpm build

  native-host:
    name: Windows Native Host
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Native Messaging host
        run: pnpm --filter clouddrive2-browser-extension run test:native-host

  universal-libav-audio:
    name: Universal libav audio core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Read audio core configuration
        shell: bash
        run: |
          echo "LIBAV_TAG=$(node -p \"require('./packages/extension/libav-audio.config.json').libavJsTag\")" >> "$GITHUB_ENV"
          echo "LIBAV_VERSION=$(node -p \"require('./packages/extension/libav-audio.config.json').libavJsTag.replace(/^v/, '')\")" >> "$GITHUB_ENV"
          echo "LIBAV_VARIANT=$(node -p \"require('./packages/extension/libav-audio.config.json').variant\")" >> "$GITHUB_ENV"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: "6.0.5"
          actions-cache-folder: cache-emsdk

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Checkout libav.js
        run: git clone --depth 1 --branch "$LIBAV_TAG" https://github.com/Yahweasel/libav.js.git .libav-build

      - name: Generate custom libav.js variant
        shell: bash
        run: |
          COMPONENTS=$(node -p "JSON.stringify(require('./packages/extension/libav-audio.config.json').components)")
          cd .libav-build/configs
          node mkconfig.js "$LIBAV_VARIANT" "$COMPONENTS"

      - name: Install libav.js dependencies
        working-directory: .libav-build
        run: npm ci

      - name: Build WebAssembly runtime
        working-directory: .libav-build
        run: make extract && make "dist/libav-${LIBAV_VERSION}-${LIBAV_VARIANT}.wasm.mjs" dist/libav.types.d.ts -j"$(nproc)"

      - name: Assemble artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="libav-audio-${LIBAV_VERSION}"
          mkdir -p "$OUT/dist" "$OUT/sources"
          cp ".libav-build/dist/libav-${LIBAV_VERSION}-${LIBAV_VARIANT}.wasm.mjs" "$OUT/dist/"
          cp ".libav-build/dist/libav-${LIBAV_VERSION}-${LIBAV_VARIANT}.wasm.wasm" "$OUT/dist/"
          cp .libav-build/dist/libav.types.d.ts "$OUT/dist/"
          cp .libav-build/LICENSE.md "$OUT/"
          cp packages/extension/libav-audio.config.json "$OUT/"
          cp .libav-build/build/ffmpeg-9.0.tar.xz "$OUT/sources/"
          git -C .libav-build archive --format=tar.gz --output="../$OUT/sources/libav.js-${LIBAV_VERSION}.tar.gz" "$LIBAV_TAG"
          (cd "$OUT" && sha256sum dist/* sources/* > SHA256SUMS)

      - name: Upload audio core artifact
        uses: actions/upload-artifact@v4
        with:
          name: libav-audio-${{ env.LIBAV_VERSION }}
          path: libav-audio-${{ env.LIBAV_VERSION }}
          if-no-files-found: error
          compression-level: 9

  universal-libav-audio:
    name: Universal libav audio core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Read audio core configuration
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const config = require('./packages/extension/libav-audio.config.json');
          console.log(`LIBAV_TAG=${config.libavJsTag}`);
          console.log(`LIBAV_VERSION=${config.libavJsTag.replace(/^v/, '')}`);
          console.log(`LIBAV_VARIANT=${config.variant}`);
          NODE

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: "6.0.5"
          actions-cache-folder: cache-emsdk

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Checkout libav.js
        run: git clone --depth 1 --branch "$LIBAV_TAG" https://github.com/Yahweasel/libav.js.git .libav-build

      - name: Generate custom libav.js variant
        shell: bash
        run: |
          COMPONENTS=$(node -p "JSON.stringify(require('./packages/extension/libav-audio.config.json').components)")
          cd .libav-build/configs
          node mkconfig.js "$LIBAV_VARIANT" "$COMPONENTS"

      - name: Install libav.js dependencies
        working-directory: .libav-build
        run: npm ci

      - name: Build WebAssembly runtime
        working-directory: .libav-build
        run: make extract && make "dist/libav-${LIBAV_VERSION}-${LIBAV_VARIANT}.wasm.mjs" dist/libav.types.d.ts -j"$(nproc)"

      - name: Assemble artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="libav-audio-${LIBAV_VERSION}"
          mkdir -p "$OUT/dist" "$OUT/sources"
          cp ".libav-build/dist/libav-${LIBAV_VERSION}-${LIBAV_VARIANT}.wasm.mjs" "$OUT/dist/"
          cp ".libav-build/dist/libav-${LIBAV_VERSION}-${LIBAV_VARIANT}.wasm.wasm" "$OUT/dist/"
          cp .libav-build/dist/libav.types.d.ts "$OUT/dist/"
          cp .libav-build/LICENSE.md "$OUT/"
          cp packages/extension/libav-audio.config.json "$OUT/"
          cp .libav-build/build/ffmpeg-9.0.tar.xz "$OUT/sources/"
          git -C .libav-build archive --format=tar.gz --output="../$OUT/sources/libav.js-${LIBAV_VERSION}.tar.gz" "$LIBAV_TAG"
          (cd "$OUT" && sha256sum dist/* sources/* > SHA256SUMS)

      - name: Upload audio core artifact
        uses: actions/upload-artifact@v4
        with:
          name: libav-audio-${{ env.LIBAV_VERSION }}
          path: libav-audio-${{ env.LIBAV_VERSION }}
          if-no-files-found: error
          compression-level: 9
